<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Queue</title>
<style>
body{font-family:sans-serif;max-width:420px;margin:0 auto;padding:16px;text-align:center}
input,select,button{font-size:18px;padding:12px;width:100%;margin:6px 0;box-sizing:border-box}
button{background:#0a7;color:#fff;border:0;border-radius:8px}
.big{font-size:64px;margin:10px 0}
.err{color:#c00;min-height:1.2em}
small{display:block;margin-top:18px}
a{color:#0a7}
</style>
</head>
<body>
<h2>💊 MedQueue</h2>
<div id="v"></div>
<p id="e" class="err"></p>
<script>
const B = "https://vyhmihcipzequxdtdoov.supabase.co/rest/v1/";
const k = "sb_publishable_jb-CXkwFwT1Dx5Zck9FO5g_zpn4w6nM";
const h = {apikey: k, Authorization: "Bearer " + k, "Content-Type": "application/json"};
const p = new URLSearchParams(location.search);
const staff = p.has("staff"), reg = p.has("register");
const v = document.getElementById("v");
const $ = id => document.getElementById(id);
const err = m => { $("e").textContent = m || ""; };
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
let me = localStorage.getItem("mq_tok");
let ss = JSON.parse(sessionStorage.getItem("mq_staff") || "null"); // {id, pin, name}

async function api(path, opt) {
  const r = await fetch(B + path, opt);
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || "Something went wrong");
  return j;
}
const rpc = (f, a) => api("rpc/" + f, {method: "POST", headers: h, body: JSON.stringify(a)});

async function shopSelect() {
  const s = await api("shops_public?select=id,name,area&order=area,name", {headers: h});
  if (!s.length) return '<p>No shops registered yet.</p>';
  let o = '<select id="s"><option value="">Choose a shop…</option>', a = "";
  for (const x of s) {
    if (x.area !== a) { if (a) o += '</optgroup>'; o += '<optgroup label="' + esc(x.area) + '">'; a = x.area; }
    o += '<option value="' + x.id + '">' + esc(x.name) + '</option>';
  }
  return o + '</optgroup></select>';
}

async function go() {
  err();
  try {
    if (reg) return showReg();
    if (staff) return ss ? showStaff(await staffQueue()) : await showLogin();
    if (!me) return await showJoin();
    showMine(await rpc("my_token", {p_id: +me, p_secret: localStorage.getItem("mq_sec")}));
  } catch (x) { err(x.message); }
}

/* ---------- customer ---------- */
async function showJoin() {
  v.innerHTML = (await shopSelect()) + '<input id="n" placeholder="Your name" maxlength="40">' +
    '<button onclick="join()">Get my token</button><small><a href="?staff">Shop staff</a></small>';
}

async function join() {
  const s = $("s") && $("s").value, n = $("n").value.trim();
  if (!s) return err("Pick a shop first");
  if (!n) return err("Type your name first");
  try {
    const r = await rpc("join_queue", {p_shop: +s, p_name: n});
    me = r.id;
    localStorage.setItem("mq_tok", me);
    localStorage.setItem("mq_sec", r.secret);
    go();
  } catch (x) { err(x.message); }
}

function showMine(b) {
  if (!b || (b.status != "waiting" && b.status != "called")) return again();
  if (b.status == "called") {
    v.innerHTML = '<div class="big">🎉</div><h3>Your turn! Go to the counter</h3><p>' + esc(b.shop) + '</p><button onclick="again()">Done</button>';
    return;
  }
  v.innerHTML = '<p>' + esc(b.shop) + ' · ' + esc(b.area) + '</p><p>Your token</p><div class="big">#' + b.num +
    '</div><p>People ahead of you: <b>' + b.ahead + '</b></p><p>About ' + b.ahead * 3 + ' min</p>' +
    '<button style="background:#888" onclick="leave()">Leave queue</button>';
}

async function leave() {
  if (!confirm("Leave the queue? You will lose your spot.")) return;
  try {
    await rpc("leave_queue", {p_id: +me, p_secret: localStorage.getItem("mq_sec")});
    again();
  } catch (x) { err(x.message); }
}

function again() {
  localStorage.removeItem("mq_tok");
  localStorage.removeItem("mq_sec");
  me = null;
  go();
}

/* ---------- shop staff ---------- */
async function showLogin() {
  v.innerHTML = (await shopSelect()) +
    '<input id="p" type="password" inputmode="numeric" maxlength="6" placeholder="6-digit PIN">' +
    '<button onclick="login()">Open staff view</button>' +
    '<small><a href="?register">Register a new shop</a> · <a href="./">I\'m a customer</a></small>';
}

async function login() {
  const s = $("s") && $("s").value, pin = $("p").value;
  if (!s || !pin) return err("Pick your shop and enter the PIN");
  try {
    const r = await rpc("staff_queue", {p_shop: +s, p_pin: pin});
    if (!r.ok) return err(r.msg);
    setStaff({id: +s, pin: pin, name: $("s").selectedOptions[0].text});
    go();
  } catch (x) { err(x.message); }
}

function setStaff(o) {
  ss = o;
  sessionStorage.setItem("mq_staff", JSON.stringify(o));
}

function logout() {
  ss = null;
  sessionStorage.removeItem("mq_staff");
  go();
}

async function staffQueue() {
  const r = await rpc("staff_queue", {p_shop: ss.id, p_pin: ss.pin});
  if (!r.ok) { logout(); throw new Error(r.msg); }
  return r.waiting;
}

function showStaff(w) {
  let s = '<p>' + esc(ss.name) + '</p><p>Waiting: <b>' + w.length + '</b></p>';
  if (w.length) {
    s += '<button onclick="next()">Call next: ' + esc(w[0].name) + ' (#' + w[0].num + ')</button>';
    s += '<ul style="list-style:none;padding:0;text-align:left;margin:16px 0">';
    for (const t of w) {
      s += '<li style="padding:10px 4px;border-bottom:1px solid #ddd"><b>#' + t.num + '</b> ' + esc(t.name) + '</li>';
    }
    s += '</ul>';
  }
  v.innerHTML = s + '<button style="background:#888" onclick="logout()">Log out</button>' +
    '<small><a href="?register">Register another shop</a></small>';
}

async function next() {
  try {
    const r = await rpc("call_next", {p_shop: ss.id, p_pin: ss.pin});
    if (!r.ok) throw new Error(r.msg);
    go();
  } catch (x) { err(x.message); }
}

/* ---------- registration ---------- */
function showReg() {
  v.innerHTML = '<input id="rn" placeholder="Shop name" maxlength="60">' +
    '<input id="ra" placeholder="Area (e.g. Kothrud)" maxlength="60">' +
    '<input id="rp" type="password" inputmode="numeric" maxlength="6" placeholder="Choose a 6-digit PIN">' +
    '<button onclick="doReg()">Register shop</button><small><a href="?staff">Back to staff login</a></small>';
}

async function doReg() {
  const n = $("rn").value.trim(), a = $("ra").value.trim(), pin = $("rp").value;
  try {
    const id = await rpc("register_shop", {p_name: n, p_area: a, p_pin: pin});
    setStaff({id: id, pin: pin, name: n});
    location.search = "?staff";
  } catch (x) { err(x.message); }
}

go();
setInterval(() => { if (!reg && (staff ? ss : me)) go(); }, 5000);
</script>
</body>
</html>
