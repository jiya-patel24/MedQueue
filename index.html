<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedQueue</title>
<style>
:root{--bg:#f5f8f7;--ink:#12302b;--mute:#667c77;--acc:#0e9a87;--accd:#0a7466;--tint:#e6f3f0;--line:#dde9e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:440px;margin:0 auto;padding:22px 16px 48px}
header{margin-bottom:18px}
.brand{font-size:15px;font-weight:700;color:var(--acc)}
h1{margin:2px 0 0;font-size:28px;line-height:1.15}
.sub{color:var(--mute);font-size:14px;margin:6px 0 0}
.sub a{color:var(--accd);cursor:pointer;text-decoration:underline}
.tabs{display:flex;background:#e3eeeb;border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:999px;font:600 15px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,48,43,.15)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
input{width:100%;font:17px inherit;font-family:inherit;padding:14px;border:1px solid #cddcd8;border-radius:12px;margin:10px 0 4px;outline:none}
input:focus,button:focus-visible,.tabs button:focus-visible{outline:3px solid rgba(14,154,135,.35);outline-offset:1px}
.btn{width:100%;font:600 17px inherit;font-family:inherit;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer;margin-top:10px}
.btn:hover{background:var(--accd)}
.btn:disabled{opacity:.6}
.lbl{font-size:14px;color:var(--mute)}
.num{font-size:96px;font-weight:800;color:var(--acc);line-height:1;margin:8px 0 4px;letter-spacing:-.03em}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:var(--tint);border-radius:14px;padding:12px;text-align:left}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.done{text-align:center}
.done .big{font-size:60px}
.list{list-style:none;margin:16px 0 0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.list .n{background:var(--tint);color:var(--accd);font-weight:700;border-radius:8px;padding:3px 10px;min-width:50px;text-align:center}
.note{background:var(--tint);color:var(--accd);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.empty{color:var(--mute);padding:18px 0 4px}
@media (prefers-reduced-motion:no-preference){.num{transition:color .2s}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand">💊 MedQueue</div>
<h1 id="shopname"></h1>
<p class="sub">Wait anywhere. We'll show when it's your turn. <a id="chg">Change shop</a></p>
</header>
<div class="tabs"><button id="tc">Customer</button><button id="ts">Staff</button></div>
<div id="v"></div>
</div>
<script>
const u = "https://vyhmihcipzequxdtdoov.supabase.co/rest/v1/tokens";
const k = "sb_publishable_jb-CXkwFwT1Dx5Zck9FO5g_zpn4w6nM";
const h = {apikey: k, "Content-Type": "application/json", Prefer: "return=representation"};
const p = new URLSearchParams(location.search);
let shop = (p.get("shop") || "").trim().toLowerCase();
let staff = p.has("staff");
let me = null, busy = false, last = "", queue = [];
const $ = id => document.getElementById(id);
const v = $("v");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
async function api(q) {
  const r = await fetch(u + q, {headers: h});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function sync() {
  const q = new URLSearchParams();
  if (shop) q.set("shop", shop);
  if (staff) q.set("staff", "1");
  history.replaceState(null, "", "?" + q.toString());
  $("tc").className = staff ? "" : "on";
  $("ts").className = staff ? "on" : "";
  $("shopname").textContent = shop || "Choose a shop";
  $("chg").style.display = shop ? "" : "none";
}
async function go() {
  sync();
  if (!shop) return showShop();
  me = localStorage.getItem("tok_" + shop);
  if (!staff && !me) return showJoin();
  try {
    const a = await api("?shop=eq." + encodeURIComponent(shop) + "&status=eq.waiting&order=id");
    if (staff) return showStaff(a);
    const b = await api("?id=eq." + me);
    showMine(b[0], a);
  } catch (e) {
    v.innerHTML = '<div class="card"><p class="empty">Can\'t reach the server. Retrying in a few seconds.</p></div>';
  }
}
function showShop() {
  v.innerHTML = '<div class="card"><div class="lbl">Which medical shop is this queue for?</div><input id="sn" value="demo-pharmacy" aria-label="Shop name"><button class="btn" onclick="setShop()">Open queue</button></div>';
}
function setShop() {
  const s = $("sn").value.trim().toLowerCase().replace(/\s+/g, "-");
  if (!s) return;
  shop = s;
  go();
}
function showJoin() {
  v.innerHTML = '<div class="card"><div class="lbl">Add your name to get a token</div><input id="n" placeholder="Your name" maxlength="40" autocomplete="name" aria-label="Your name"><button class="btn" id="jb" onclick="join()">Get my token</button></div>';
}
async function join() {
  if (busy) return;
  const n = $("n").value.trim();
  if (!n) return alert("Type your name first");
  busy = true;
  $("jb").disabled = true;
  try {
    const r = await fetch(u, {method: "POST", headers: h, body: JSON.stringify({shop: shop, name: n})});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    localStorage.setItem("tok_" + shop, d[0].id);
  } catch (e) {
    alert("Couldn't get a token. Check your connection and try again.");
    busy = false;
    $("jb").disabled = false;
    return;
  }
  busy = false;
  go();
}
function showMine(b, a) {
  if (!b) return again();
  if (b.status == "called") {
    v.innerHTML = '<div class="card done"><div class="big">🎉</div><h2>It\'s your turn</h2><p class="sub">Please go to the counter with token #' + b.num + '.</p><button class="btn" onclick="again()">Done</button></div>';
    return;
  }
  const c = a.filter(x => x.id < me).length;
  v.innerHTML = '<div class="card"><div class="lbl">Your token, ' + esc(b.name) + '</div><div class="num">#' + b.num + '</div><div class="stats"><div class="stat"><b>' + c + '</b><span>people ahead</span></div><div class="stat"><b>~' + c * 3 + ' min</b><span>estimated wait</span></div></div></div>';
}
function again() {
  localStorage.removeItem("tok_" + shop);
  me = null;
  showJoin();
}
function showStaff(a) {
  queue = a;
  let s = '<div class="card">';
  if (last) s += '<div class="note">' + last + '</div>';
  s += '<div class="stats"><div class="stat"><b>' + a.length + '</b><span>waiting</span></div><div class="stat"><b>~' + a.length * 3 + ' min</b><span>to clear the queue</span></div></div>';
  if (a.length) {
    s += '<button class="btn" onclick="next(' + a[0].id + ')">Call next: ' + esc(a[0].name) + ' (#' + a[0].num + ')</button><ul class="list">';
    a.forEach(x => { s += '<li><span class="n">#' + x.num + '</span>' + esc(x.name) + '</li>'; });
    s += '</ul>';
  } else {
    s += '<p class="empty">No one is waiting. New tokens appear here automatically.</p>';
  }
  v.innerHTML = s + '</div>';
}
async function next(id) {
  if (busy) return;
  busy = true;
  const x = queue.find(t => t.id == id);
  try {
    const r = await fetch(u + "?id=eq." + id, {method: "PATCH", headers: h, body: JSON.stringify({status: "called"})});
    if (!r.ok) throw new Error(r.status);
    if (x) last = "Called: " + esc(x.name) + " (#" + x.num + ")";
  } catch (e) {
    alert("Couldn't call the next person. Try again.");
  }
  busy = false;
  go();
}
$("tc").onclick = () => { staff = false; go(); };
$("ts").onclick = () => { staff = true; go(); };
$("chg").onclick = () => { shop = ""; go(); };
go();
setInterval(() => { if (!busy && shop && (staff || localStorage.getItem("tok_" + shop))) go(); }, 5000);
</script>
</body>
</html>
